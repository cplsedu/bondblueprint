<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BondBlueprint™ — Email Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #E8E4DF; color: #1E1E1E; }

  .toolbar {
    position: sticky; top: 0; z-index: 100;
    background: #1A1030;
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    border-bottom: 2px solid #2E1A5A;
  }
  .toolbar-title { font-size: 13px; font-weight: 700; color: #E8758A; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
  .tab-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 6px 16px; border-radius: 100px; font-size: 12px; font-weight: 700;
    cursor: pointer; border: 1.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.55); background: transparent; transition: all 0.15s;
    font-family: inherit; white-space: nowrap;
  }
  .tab:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.3); }
  .tab.active { background: #7C5CBF; border-color: #7C5CBF; color: #fff; }

  .view-toggle { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .view-btn {
    padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700;
    cursor: pointer; border: 1.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5); background: transparent; transition: all 0.15s;
    font-family: inherit;
  }
  .view-btn.active { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.3); }

  .stage { padding: 32px 24px; max-width: 1400px; margin: 0 auto; }

  .email-meta {
    max-width: 620px; margin: 0 auto 18px;
    background: #fff; border-radius: 10px; padding: 14px 20px;
    border: 1.5px solid #DDD7CE;
  }
  .email-meta-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; }
  .email-meta-row:last-child { margin-bottom: 0; }
  .meta-label { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #9A908A; width: 56px; flex-shrink: 0; }
  .meta-val { font-size: 13px; font-weight: 600; color: #1E1E1E; }
  .meta-delay { font-size: 11px; font-weight: 700; color: #7C5CBF; background: #F2EEFB; padding: 2px 10px; border-radius: 100px; }

  .email-frame-wrap {
    max-width: 620px; margin: 0 auto;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    border: 1.5px solid #DDD7CE;
  }
  .email-frame-wrap iframe { display: block; width: 100%; border: none; background: #F7F3EE; }

  .mobile-wrap { display: flex; justify-content: center; }
  .phone-shell { width: 375px; background: #1A1A1A; border-radius: 40px; padding: 14px 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .phone-screen { background: #F7F3EE; border-radius: 30px; overflow: hidden; }
  .phone-screen iframe { display: block; width: 100%; border: none; background: #F7F3EE; }

  .all-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .all-card-label { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #6B6560; margin-bottom: 8px; padding-left: 4px; }
  .all-card .email-frame-wrap { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">Email Preview</span>
  <div class="tab-group" id="tabs">
    <button class="tab active" onclick="showPanel('purchase', this)">Purchase</button>
    <button class="tab" onclick="showPanel('cart1', this)">Cart 1 · 1hr</button>
    <button class="tab" onclick="showPanel('cart2', this)">Cart 2 · 24hr</button>
    <button class="tab" onclick="showPanel('cart3', this)">Cart 3 · 48hr</button>
    <button class="tab" onclick="showPanel('cart4', this)">Cart 4 · 5d</button>
    <button class="tab" onclick="showPanel('cart5', this)">Cart 5 · 10d</button>
    <button class="tab" onclick="showPanel('all', this)">All</button>
  </div>
  <div class="view-toggle" id="viewToggle">
    <button class="view-btn active" onclick="setView('desktop', this)">Desktop</button>
    <button class="view-btn" onclick="setView('mobile', this)">Mobile</button>
  </div>
</div>

<div class="stage" id="stage"></div>

<script>
const CART_URL = 'https://bond.coupleseducator.com?back=1';

function hdr(accent) {
  return `<div style="background:linear-gradient(135deg,#1A1030 0%,#2E1A5A 55%,#1E2D4E 100%);border-radius:14px;padding:26px 28px 22px;margin-bottom:20px"><p style="margin:0 0 10px;font-size:10px;letter-spacing:3px;color:${accent};font-weight:700;text-transform:uppercase">BONDBLUEPRINT™</p><div style="width:36px;height:2px;background:${accent};border-radius:2px"></div></div>`;
}
function card(c) {
  return `<div style="background:#FFFFFF;border-radius:14px;padding:30px 28px;border:1.5px solid #DDD7CE;margin-bottom:16px">${c}</div>`;
}
function cta(txt, col) {
  return `<div style="text-align:center;margin:28px 0 8px"><a href="${CART_URL}" style="display:inline-block;background:${col};color:#fff;font-size:15px;font-weight:700;text-decoration:none;border-radius:100px;padding:14px 36px">${txt}</a></div>`;
}
function box(txt, accent, bg) {
  return `<div style="background:${bg};border-left:3px solid ${accent};border-radius:0 10px 10px 0;padding:14px 18px;margin:20px 0"><p style="margin:0;font-size:14px;line-height:1.7;font-weight:600;color:#1E1E1E">${txt}</p></div>`;
}
function p(txt, extra='') {
  return `<p style="margin:0 0 14px;font-size:15px;color:#5A5450;line-height:1.75;${extra}">${txt}</p>`;
}
function qte(txt, name) {
  return `<div style="background:#F7F3EE;border-radius:10px;padding:14px 18px;margin:12px 0"><p style="margin:0 0 6px;font-size:14px;color:#1E1E1E;line-height:1.7;font-style:italic">"${txt}"</p><p style="margin:0;font-size:12px;color:#9A908A;font-weight:700">${name}</p></div>`;
}
function sig() {
  return `<p style="margin:20px 0 0;font-size:14px;color:#6B6560">Ash | Couples Educator</p>`;
}
function ft() {
  return `<p style="text-align:center;font-size:11px;color:#9A908A;line-height:1.8;margin:0">BondBlueprint™ · CouplesEducator.com<br>Psychoeducational content only, not therapy or clinical advice.<br><a href="#" style="color:#9A908A;text-decoration:underline">Unsubscribe</a></p>`;
}
function wrap(accentColor, body) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;padding:0;background:#F7F3EE;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif"><div style="max-width:560px;margin:0 auto;padding:28px 16px 40px">${hdr(accentColor)}${card(body)}${ft()}</div></body></html>`;
}

// ── Purchase ─────────────────────────────────────────────────────────────────
const purchaseHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F7F3EE;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
<div style="max-width:560px;margin:0 auto;padding:28px 16px 40px">
<div style="background:linear-gradient(135deg,#1A1030 0%,#2E1A5A 55%,#1E2D4E 100%);border-radius:14px;padding:30px 28px 26px;text-align:center;margin-bottom:20px">
  <p style="margin:0 0 12px;font-size:10px;letter-spacing:3px;color:#E8758A;font-weight:700;text-transform:uppercase">BONDBLUEPRINT™</p>
  <h1 style="margin:0 0 8px;font-size:21px;color:#FFFFFF;line-height:1.3;font-weight:700">Your Personal Relationship Guide</h1>
  <p style="margin:0;font-size:12px;color:rgba(255,255,255,0.5);font-weight:600">Your steps to a healthier relationship start here.</p>
</div>
<div style="background:#FFFFFF;border-radius:14px;padding:30px 28px;border:1.5px solid #DDD7CE;margin-bottom:16px">
  <p style="margin:0 0 16px;font-size:16px;color:#1E1E1E;font-weight:600">Hi Sarah,</p>
  <p style="margin:0 0 16px;font-size:15px;color:#5A5450;line-height:1.75">Your Blueprint is attached as a PDF.</p>
  <p style="margin:0 0 20px;font-size:15px;color:#5A5450;line-height:1.75">The scripts, the 7-day plan, the breakdown of what's actually been happening. All of it was built from what you shared. It's yours.</p>
  <div style="background:#F2EEFB;border-left:3px solid #7C5CBF;border-radius:0 10px 10px 0;padding:16px 20px;margin:0 0 20px">
    <p style="margin:0 0 10px;font-size:12px;font-weight:700;color:#7C5CBF;text-transform:uppercase;letter-spacing:1.5px">Where to start</p>
    <p style="margin:0 0 7px;font-size:14px;color:#3A2060;line-height:1.65;font-weight:600">💬&nbsp; Scripts first. Use one today.</p>
    <p style="margin:0 0 7px;font-size:14px;color:#3A2060;line-height:1.65;font-weight:600">📖&nbsp; Then read what's actually been happening and why.</p>
    <p style="margin:0 0 7px;font-size:14px;color:#3A2060;line-height:1.65;font-weight:600">📅&nbsp; Work through the 7-day plan when you're ready.</p>
    <p style="margin:0;font-size:14px;color:#3A2060;line-height:1.65;font-weight:600">📌&nbsp; Save it. You'll want to come back to it.</p>
  </div>
  <p style="margin:0 0 16px;font-size:15px;color:#5A5450;line-height:1.75">If you have questions, just reply. I read every one.</p>
  <p style="margin:0;font-size:15px;color:#6B6560">Ash | Couples Educator</p>
</div>
${ft()}
</div></body></html>`;

// ── Cart 1 ────────────────────────────────────────────────────────────────────
const cart1Html = wrap('#C4516A', `
  ${p('You were right there.', 'font-size:18px;font-weight:700;color:#1E1E1E;')}
  ${p("Something made you stop on that page. And it wasn't random.")}
  ${p("You've been feeling this for a while. The back and forth. Not knowing where you stand. The overthinking that won't stop, no matter how much you tell yourself to just let it go.")}
  ${p("You found something that was actually going to tell you what's been happening. Not a generic guide. Something built around your exact situation.")}
  ${p("That's still there waiting for you.")}
  ${box("You don't have to start over. Just come back and finish what you started.", '#C4516A', '#FCEEF1')}
  ${cta('Get what you came for →', '#C4516A')}
  ${sig()}
`);

// ── Cart 2 ────────────────────────────────────────────────────────────────────
const cart2Html = wrap('#7C5CBF', `
  ${p("You didn't just forget to finish this.", 'font-size:17px;font-weight:700;color:#1E1E1E;')}
  ${p("Part of you wants to finally understand what's been driving the pattern. Why you keep ending up here. What's actually going on underneath it all.")}
  ${p("And also to know what to do next.")}
  ${p("But another part of you is asking: <em>what if I go through this and nothing actually changes?</em>")}
  ${p("That's not doubt. That's someone who's already tried things and gotten nowhere.")}
  ${box("Most people who get this start in the same place. Skeptical. Worn out. Not sure it'll be different. Then they read the breakdown of their situation and something shifts.", '#7C5CBF', '#F2EEFB')}
  ${p("You're not trying to fix yourself. You're trying to finally understand what's been happening, and get a clear next move.")}
  ${cta('Take another look →', '#7C5CBF')}
  ${sig()}
`);

// ── Cart 3 ────────────────────────────────────────────────────────────────────
const cart3Html = wrap('#2E8B8B', `
  ${p("You've been here before.", 'font-size:17px;font-weight:700;color:#1E1E1E;')}
  ${p("Things feel okay for a bit. Then something shifts. A message that doesn't land right, a moment where they pull back, or that familiar feeling of doing all the work while they stay just out of reach.")}
  ${p("And before you know it, you're in it again.")}
  ${p("You don't need more time. You don't need a different person. You need to understand the specific pattern that keeps replaying, and know exactly what to do when it starts.")}
  ${box("This gives you both. The breakdown of what's been happening and a clear step-by-step for what to do next.", '#2E8B8B', '#EAF6F6')}
  ${p("You can keep waiting to see if it changes on its own.")}
  ${p("Or you can understand it today and go into the next conversation differently.")}
  ${cta('Change how it goes →', '#2E8B8B')}
  ${sig()}
`);

// ── Cart 4 ────────────────────────────────────────────────────────────────────
const cart4Html = wrap('#C4860A', `
  ${p("Honestly? You might not want to go through this.", 'font-size:17px;font-weight:700;color:#1E1E1E;')}
  ${p("Because it's going to show you your side of the pattern. Not just theirs.")}
  ${p("It's going to point out the things you've been doing that have been making this harder. The ways you've been showing up that push people away, or pull them in too fast, or keep you stuck chasing something that keeps moving.")}
  ${p("That's uncomfortable. A lot of people would rather not see it.")}
  ${box("The people who do go through it almost always say the same thing: they wish they'd understood this sooner.", '#C4860A', '#FBF5E6')}
  ${qte("I finally understood why I kept ending up in the same situation. I thought it was them. Some of it was me. That was hard to see, but it changed everything.", "K.T.")}
  ${qte("I used one of the scripts the same day. The conversation went completely differently than it ever had before.", "M.R.")}
  ${qte("I've tried journaling, therapy, talking to friends. This is the first thing that actually showed me what to do in the moment.", "J.A.")}
  ${p("If you're not ready to look at it honestly, this isn't for you.")}
  ${p("But if you're tired of the same outcome and something in you knows you're part of why it keeps happening, that's exactly what this is for.")}
  ${p("I'm here whenever you're ready.")}
  ${cta("I'm ready →", '#C4860A')}
  ${sig()}
`);

// ── Cart 5 ────────────────────────────────────────────────────────────────────
const cart5Html = wrap('#6B6560', `
  ${p("What actually stopped you?", 'font-size:17px;font-weight:700;color:#1E1E1E;')}
  ${p("Was it that you weren't sure it would help?")}
  ${p("That looking at this felt like too much right now?")}
  ${p("Or that part of you would rather not know?")}
  ${p("Usually it's that last one.", 'color:#1E1E1E;font-weight:700;')}
  ${p("Not because you're in denial. But because seeing the pattern clearly means you can't keep doing things the same way. And change, even change you want, can feel like a lot.")}
  ${box("But here's what's also true: you're already living inside this pattern. It's already affecting you. Not looking at it isn't protecting you from it.", '#1E2D4E', '#EBF0F8')}
  ${p("If this is still sitting with you, there's probably a reason.")}
  ${cta('Come back to it →', '#1E2D4E')}
  ${sig()}
`);

// ── Panel config ──────────────────────────────────────────────────────────────
const panels = {
  purchase: { label: 'Purchase confirmation', subject: 'Your BondBlueprint is ready, Sarah', delay: 'Sends immediately after payment', html: purchaseHtml },
  cart1:    { label: 'Abandoned cart — Email 1', subject: 'You were right there', delay: '1 hour after viewing checkout', html: cart1Html },
  cart2:    { label: 'Abandoned cart — Email 2', subject: "You didn't just forget", delay: '24 hours after viewing checkout', html: cart2Html },
  cart3:    { label: 'Abandoned cart — Email 3', subject: 'You already know how this goes', delay: '48 hours after viewing checkout', html: cart3Html },
  cart4:    { label: 'Abandoned cart — Email 4', subject: "Here's why you probably shouldn't do this", delay: '5 days after viewing checkout', html: cart4Html },
  cart5:    { label: 'Abandoned cart — Email 5', subject: 'One question', delay: '10 days after viewing checkout', html: cart5Html },
};

let currentView = 'desktop';
let currentPanel = 'purchase';

function makeIframe(html) {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:100%;border:none;display:block;background:#F7F3EE';
  f.height = 800;
  f.srcdoc = html;
  f.onload = () => { try { const h = f.contentDocument.body.scrollHeight; if (h > 100) f.height = h + 8; } catch(e){} };
  return f;
}

function renderPanel(id) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';

  if (id === 'all') {
    document.getElementById('viewToggle').classList.add('hidden');
    const grid = document.createElement('div');
    grid.className = 'all-grid';
    Object.entries(panels).forEach(([key, data]) => {
      const card = document.createElement('div');
      card.className = 'all-card';
      card.innerHTML = `<div class="all-card-label">${data.label}</div>`;
      const fw = document.createElement('div');
      fw.className = 'email-frame-wrap';
      fw.appendChild(makeIframe(data.html));
      card.appendChild(fw);
      grid.appendChild(card);
    });
    stage.appendChild(grid);
    return;
  }

  document.getElementById('viewToggle').classList.remove('hidden');
  const data = panels[id];
  if (!data) return;

  const meta = document.createElement('div');
  meta.className = 'email-meta';
  meta.innerHTML = `
    <div class="email-meta-row"><span class="meta-label">From</span><span class="meta-val">Ash @ CouplesEducator &lt;hello@coupleseducator.com&gt;</span></div>
    <div class="email-meta-row"><span class="meta-label">Subject</span><span class="meta-val" style="font-weight:700;color:#1A1030">${data.subject}</span></div>
    <div class="email-meta-row"><span class="meta-label">Timing</span><span class="meta-delay">${data.delay}</span></div>`;
  stage.appendChild(meta);

  if (currentView === 'mobile') {
    const mw = document.createElement('div'); mw.className = 'mobile-wrap';
    const ph = document.createElement('div'); ph.className = 'phone-shell';
    const sc = document.createElement('div'); sc.className = 'phone-screen';
    sc.appendChild(makeIframe(data.html));
    ph.appendChild(sc); mw.appendChild(ph); stage.appendChild(mw);
  } else {
    const fw = document.createElement('div'); fw.className = 'email-frame-wrap';
    fw.appendChild(makeIframe(data.html));
    stage.appendChild(fw);
  }
}

function showPanel(id, btn) {
  currentPanel = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderPanel(id);
}
function setView(v, btn) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPanel(currentPanel);
}

renderPanel('purchase');
</script>
</body>
</html>
