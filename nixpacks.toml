[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "ca-certificates",
  "glib",
  "fontconfig",
  "dbus",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "mesa",
  "expat",
  "alsaLib",
  "cups",
  "libdrm",
  "libxkbcommon",
  "at-spi2-atk",
  "at-spi2-core",
  "atk",
  "pango",
  "cairo",
  "gdk-pixbuf"
]

[phases.install]
cmds = ["PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install"]

[start]
cmd = "PUPPETEER_EXECUTABLE_PATH=$(which chromium) node bb-server.js"
